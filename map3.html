    <script>
        // マップの領域定義
        const mapAreas = [
            { coords: [10,55,85,195], href: "kikakuGG-detail.html" },
            { coords: [100,55,175,195], href: "kikakuC-detail.html" },
            { coords: [185,55,255,195], href: "kikakuJ-detail.html" },
            { coords: [260,55,335,195], href: "kikakuK-detail.html" },
            { coords: [570,69,721,170], href: "kikakuPP-detail.html" },
            { coords: [350,385,420,531], href: "kikakuM-detail.html" },
            { coords: [263,385,340,531], href: "kikakuL-detail.html" },
            { coords: [185,385,260,531], href: "kikakuT-detail.html" },
            { coords: [105,385,180,531], href: "kikakuU-detail.html" },
            { coords: [773,1,829,28], href: "kikaku1.html" },
            { coords: [580,1,635,29], href: "kikaku2.html" },
            { coords: [485,569,530,600], href: "kikaku3.html" },
            { coords: [155,1,217,29], href: "kikaku4.html" },
            { coords: [135,569,191,600], href: "kikaku5.html" }
        ];





        // 元の画像サイズ（必要に応じて調整）
        const originalWidth = 1200;
        const originalHeight = 600;

        function createMapAreas() {
            const mapImage = document.getElementById('mapImage');
            const mapOverlay = document.getElementById('mapOverlay');
            
            mapOverlay.innerHTML = '';

            const currentWidth = mapImage.offsetWidth;
            const currentHeight = mapImage.offsetHeight;
            
            const scaleX = currentWidth / originalWidth;
            const scaleY = currentHeight / originalHeight;

            mapAreas.forEach(area => {
                const [x1, y1, x2, y2] = area.coords;
                
                const element = document.createElement('a');
                element.href = area.href;
                element.className = 'map-area';
                element.style.left = (x1 * scaleX) + 'px';
                element.style.top = (y1 * scaleY) + 'px';
                element.style.width = ((x2 - x1) * scaleX) + 'px';
                element.style.height = ((y2 - y1) * scaleY) + 'px';
                
                mapOverlay.appendChild(element);
            });
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            createMapAreas();
        });

        // リサイズ時に再計算
        window.addEventListener('resize', function() {
            createMapAreas();
        });

        // 画像読み込み後も実行
        document.getElementById('mapImage').addEventListener('load', function() {
            createMapAreas();
        });
    </script>
