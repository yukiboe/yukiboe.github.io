<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>準備中 | 第14回兎原祭</title>
    <style>
        :root {
            --main-color: #00d4ff;
            --accent-color: #ff007b;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--main-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .footer-logo {
            margin-top: 50px;
            opacity: 0.6;
        }

        .footer-logo img {
            width: 100px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚧</div>
        <h1>Coming Soon</h1>
        <p>このページは現在準備中です。<br>公開まで今しばらくお待ちください。</p>
        
        <a href="index.html" class="btn-back">トップページへ戻る</a>

        <div class="footer-logo">
            <img src="images/無題43_0030-12-25_20260404202725.png" alt="兎原祭ロゴ">
        </div>
    </div>

</body>
</html>
