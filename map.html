    <script>
        // マップの領域定義
        const mapAreas = [
            { coords: [250, 95, 300, 130], href: "kikakuEE-detail.html" },
            { coords: [250, 130, 300, 150], href: "kikakuVV-detail.html" },
            { coords: [305, 95, 355, 130], href: "kikakuBB-detail.html" },
            { coords: [305, 130, 355, 150], href: "kikakuCC-detail.html" },
            { coords: [360, 95, 405, 150], href: "kikakuP-detail.html" },
            { coords: [405, 51, 470, 90], href: "kikakuQQ-detail.html" },
            { coords: [500, 150, 555, 200], href: "kikakuPC-detail.html" },
            { coords: [500, 210, 555, 265], href: "kikakuFF-detail.html" },
            { coords: [250, 230, 300, 285], href: "kikakuDD-detail.html" },
            { coords: [305, 230, 350, 285], href: "kikakuQQ-detail.html" },
            { coords: [355, 230, 400, 285], href: "kikakuQQ-detail.html" },
            { coords: [415, 230, 455, 285], href: "kikakuQ-detail.html" },
            { coords: [145, 205, 200, 257], href: "kikakuW-detail.html" },
            { coords: [341, 475, 460, 550], href: "kikaku6.html" },
            { coords: [5, 451, 183, 554], href: "kikakuN-detail.html" },
            { coords: [1023, 77, 1193, 283], href: "kikakuV-detail.html" },
            { coords: [370, 160, 420, 178], href: "kikakuX-detail.html" },
            { coords: [695, 50, 760, 83], href: "kikaku1.html" },
            { coords: [564, 50, 620, 83], href: "kikaku2.html" },
            { coords: [471, 303, 547, 331], href: "kikaku3.html" },
            { coords: [285, 50, 334, 83], href: "kikaku4.html" },
            { coords: [277, 303, 329, 331], href: "kikaku5.html" }
        ];

        // 元の画像サイズ（必要に応じて調整）
        const originalWidth = 1200;
        const originalHeight = 600;

        function createMapAreas() {
            const mapImage = document.getElementById('mapImage');
            const mapOverlay = document.getElementById('mapOverlay');
            
            mapOverlay.innerHTML = '';

            const currentWidth = mapImage.offsetWidth;
            const currentHeight = mapImage.offsetHeight;
            
            const scaleX = currentWidth / originalWidth;
            const scaleY = currentHeight / originalHeight;

            mapAreas.forEach(area => {
                const [x1, y1, x2, y2] = area.coords;
                
                const element = document.createElement('a');
                element.href = area.href;
                element.className = 'map-area';
                element.style.left = (x1 * scaleX) + 'px';
                element.style.top = (y1 * scaleY) + 'px';
                element.style.width = ((x2 - x1) * scaleX) + 'px';
                element.style.height = ((y2 - y1) * scaleY) + 'px';
                
                mapOverlay.appendChild(element);
            });
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            createMapAreas();
        });

        // リサイズ時に再計算
        window.addEventListener('resize', function() {
            createMapAreas();
        });

        // 画像読み込み後も実行
        document.getElementById('mapImage').addEventListener('load', function() {
            createMapAreas();
        });
    </script>
