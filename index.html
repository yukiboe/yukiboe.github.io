<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <title>第14回兎原祭</title>
    <meta name="description" content="兎原祭の公式サイトです。">
    <meta name="viewport" content="width=device-width">
    <style>
        @charset "UTF-8";


/* 基本設定 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    line-height: 1.8;
    color: #333;
    background-color: #ffffff; /* わずかに青みのある白で清潔感を */
}

/* メインビジュアル：IMG_0458.jpg を使用 */
.main-visual {
    height: 70vh; /* 少し高めにして空をしっかり見せる */
    background: linear-gradient(rgba(175, 169, 224, 0.2), rgba(147, 134, 195, 0.3)), 
                url('../IMG_0458.jpg'); /* フォルダ構成に合わせてパスを調整してください */
    background-size: cover;
    background-position: center 60%; /* 校舎と空のバランスが良い位置に調整 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
    padding: 20px;
}

.main-visual-title {
    font-size: clamp(2.5rem, 8vw, 4rem); /* 画面幅に合わせてサイズが可変 */
    font-weight: bold;
    color: #0724dc; 
    letter-spacing: 0.15em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 15px;
}

.main-visual-subtitle {
    font-size: 1.2rem;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.9);
    color: #0077b6; /* 青空に合わせた爽やかな青 */
    padding: 8px 25px;
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* メインコンテンツ */
.main-content {
    max-width: 900px;
    margin: 80px auto;
    padding: 0 30px;
    text-align: center;
}

.main-content-title {
    font-size: 1.8rem;
    color: #0077b6;
    margin-bottom: 30px;
    position: relative;
    display: inline-block;
}

/* タイトルの下の装飾（波打つようなライン） */
.main-content-title::after {
    content: "";
    display: block;
    width: 100%;
    height: 6px;
    background: linear-gradient(to right, #00b4d8, transparent);
    margin-top: 8px;
    border-radius: 3px;
}

.main-content-text {
    font-size: 1.1rem;
    color: #555;
}

/* スマホ対応 */
@media (max-width: 768px) {
    .main-visual{
        padding-left: 10px;
        padding-right: 10px;
    }
    .main-visual-title {
        font-size: 33px;
    }

    .main-visual-subtitle  {
        font-size: 15px;
    }

    .main-visual {
        height: 50vh;
    }
    .main-content {
        margin: 50px auto;
    }
}
        </style>

        
</head>

<body>
    <section class="main-visual">
            <h1 class="main-visual-title">第14回兎原祭</h1>
            <p class="main-visual-subtitle">2026年5月15日(金)・16日(土)</p>
        </section>

                <section class="main-content">
            <h2 class="main-content-title">ようこそ、兎原祭へ！</h2>
            <p class="main-content-text">兎原祭の受付が4月18日から、mirai-compass上で開始されます。<br>このサイト上で最新情報や当日の案内を随時更新していきます。</p>
        </section>
</body>
