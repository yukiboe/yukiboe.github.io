<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第14回兎原祭</title>
    <meta name="description" content="兎原祭の公式サイトです。">
    <meta name="viewport" content="width=device-width">
    
    <style>
        /* 基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #ffffff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* メインビジュアル */
        .main-visual {
            height: 70vh;
            background: linear-gradient(rgba(175, 169, 224, 0.2), rgba(147, 134, 195, 0.3)), 
                        url('../IMG_0458.jpg'); 
            background-size: cover;
            background-position: center 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .main-visual-title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: bold;
            color: #0724dc; 
            letter-spacing: 0.15em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .main-visual-subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            color: #0077b6;
            padding: 8px 25px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* メインコンテンツ */
        .main-content {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 30px;
            text-align: center;
        }

        .main-content-title {
            font-size: 1.8rem;
            color: #0077b6;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .main-content-title::after {
            content: "";
            display: block;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #00b4d8, transparent);
            margin-top: 8px;
            border-radius: 3px;
        }

        /* ロゴ紹介セクション */
        .logo-section {
            padding: 60px 0;
            background: #f8f9fa;
        }

        .logo-flex {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .logo-image {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        .logo-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .logo-text {
            flex: 1;
            min-width: 300px;
        }

        /* YouTubeセクション */
        .video-section {
            padding: 60px 0;
            text-align: center;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 800px;
            margin: 20px auto;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* SNSセクション */
        .sns-section {
            padding: 60px 0;
            background: #333;
            color: #fff;
            text-align: center;
        }

        .sns-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .sns-btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.3s;
        }

        .insta { background: #E1306C; }
        .x-twitter { background: #000; }
        .school-web { background: #0077b6; }

        .sns-btn:hover { opacity: 0.8; transform: translateY(-3px); }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .main-visual { height: 50vh; }
            .main-visual-title { font-size: 1.8rem; }
            .logo-flex { flex-direction: column; text-align: center; }
        }
    </style>
</head>

<body>
    <section class="main-visual">
        <h1 class="main-visual-title">第14回兎原祭</h1>
        <p class="main-visual-subtitle">2026年5月15日(金)・16日(土)</p>
    </section>

    <section class="main-content">
        <h2 class="main-content-title">ようこそ、兎原祭へ！</h2>
        <p class="main-content-text">
            兎原祭の受付が4月18日から、mirai-compass上で開始されます。<br>
            このサイト上で最新情報や当日の案内を随時更新していきます。
        </p>
    </section>



    <section class="sns-section">
        <div class="container">
            <h2>Official Links</h2>
            <div class="sns-links">
                <a href="https://www.instagram.com/ku_secondary_kouhou/" class="sns-btn insta">Instagram</a>
                <a href="https://x.com/KU_Secondary" class="sns-btn x-twitter">X (Twitter)</a>
                <a href="https://www.edu.kobe-u.ac.jp/kuss-top/" class="sns-btn school-web">本校ホームページ</a>
            </div>
            <p style="margin-top: 40px; font-size: 0.8rem; opacity: 0.6;">© 2026 兎原祭実行委員会</p>
        </div>
    </section>
</body>
</html>
